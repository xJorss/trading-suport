# Serves the built SPA and fronts the FastAPI engine.
# Mounted as /etc/nginx/conf.d/default.conf inside the nginx image.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed asset filenames are immutable; the HTML must never be cached or a
    # deploy would keep pointing at deleted chunks.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # REST API -> FastAPI. `backend` is the compose service name; on a plain
    # `docker run` without a user-defined network, swap it for the container IP.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # WebSocket -> FastAPI. The engine pushes state once per second, so the read
    # timeout only has to survive a quiet period, not a whole candle.
    location /ws {
        proxy_pass http://backend:8000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Client-side routing: unknown paths are the SPA's, not 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
